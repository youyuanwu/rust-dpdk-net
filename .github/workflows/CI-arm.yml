name: build-arm

# ARM64 build-only gate. Verifies the workspace compiles on aarch64.
# Tests, release binaries, and e2e are intentionally skipped until the
# ARM toolchain path is proven stable. Once stable, fold this into
# CI.yml as a matrix on `os`.

on:
  push:
  pull_request:

jobs:
  dpdk-arm:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@v7

    - name: Install rust
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: "1.98.1"

    - name: Install Ubuntu DPDK
      run: |
        sudo apt-get update
        sudo apt-get install -y libdpdk-dev libjitterentropy3-dev pkgconf clang lld

    - name: Verify DPDK dependencies
      run: ./scripts/check-deps.sh

    - name: Build DPDK bindings
      run: cargo build -p dpdk-net-sys

  build-arm:
    runs-on: ubuntu-26.04-arm
    steps:
    - uses: actions/checkout@v7

    - name: Remove toolchain file
      run: rm -f rust-toolchain.toml

    - name: Install rust stable
      uses: actions-rust-lang/setup-rust-toolchain@v2
      with:
        toolchain: "1.98.1"
        components: clippy

    - uses: taiki-e/install-action@protoc

    - name: Install Ubuntu DPDK
      run: |
        sudo apt-get update
        sudo apt-get install -y libdpdk-dev libjitterentropy3-dev pkgconf clang lld

    - name: Run cargo check
      run: cargo check --all-targets

    - name: Run cargo clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Run cargo test
      run: cargo test --all -- --nocapture
